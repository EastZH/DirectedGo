[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "directedgo"
version = "0.1.0"
description = "Go on a graph: fixed vertices, mutable bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["directedgo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: long-running stress tests"]
